[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "instacards"
version = "0.1.0"
description = "FLUX/ComfyUI Instagram carousel renderer and publisher"
requires-python = ">=3.12"
dependencies = ["Pillow>=10"]

[project.scripts]
instacards = "instacards.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

